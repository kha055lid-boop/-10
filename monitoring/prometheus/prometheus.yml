# 12. إنشاء ملف monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# قواعد الإنذار
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# قواعد التسجيل
rule_files:
  - 'alert.rules.yml'

# أهداف الجمع
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'namaa-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'namaa-frontend'
    metrics_path: '/_next/static/__next-build-watcher'
    static_configs:
      - targets: ['host.docker.internal:3001']

# إعدادات التجميع عن بعد
remote_write:
  - url: 'http://thanos:10908/api/v1/receive'
    queue_config:
      max_samples_per_send: 10000
      capacity: 20000

# إعدادات التخزين
storage:
  tsdb:
    retention: 15d
    min-block-duration: 2h
    max-block-duration: 24h

// 16. إنشاء ملف docker-compose.prod.yml
version: '3.8'

services:
  # تطبيق Node.js
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: namaa-app
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis
    networks:
      - namaa-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # قاعدة البيانات MySQL
  db:
    image: mysql:8.0
    container_name: namaa-db
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - db_data:/var/lib/mysql
      - ./db/backup:/backup
      - ./db/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - namaa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  # Redis للكاش والجلسات
  redis:
    image: redis:alpine
    container_name: namaa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - namaa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx كـ Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: namaa-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - app
    networks:
      - namaa-network

  # نسخ احتياطي تلقائي
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: namaa-backup
    env_file: .env.backup
    volumes:
      - ./db/backup:/backup
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    networks:
      - namaa-network
    restart: unless-stopped

networks:
  namaa-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
